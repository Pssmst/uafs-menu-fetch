<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
        <style>
            :root {
                --bg-card: #ece5d5;
                --bg-nutrition: #f0ebdf;

                --border-tint: #807466;
                --hairline1: rgba(37, 44, 42, 0.3);
                --hairline2: rgba(110, 104, 88, 0.65);
                
                --ink1: #4a4743;
                --ink2: #757069;

                --accent: #1964bb;
                --accent-dark: #1d408b;
                --accent-faded: rgba(38, 45, 139, 0.08);
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                padding: 20px;
                font-family: 'Lora', 'Georgia', serif;
                color: var(--ink2);
                overflow-x: hidden;
                overflow-y: hidden; 
                max-width: 100vw;
                height: 100vh;

                display: flex;
                flex-direction: row-reverse;

                background: url('background.jpg') no-repeat center center fixed;
                background-size: cover;
                background-color: #000;
            }

            .widget-card {
                width: 435px;
                max-width: 100%;
                max-height: 90vh;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                position: relative;
                
                background-color: var(--bg-card);
                /* Subtle paper texture/lighting effect */
                background-image:
                    radial-gradient(circle at 15% 10%, rgba(0, 0, 0, 0.01), transparent 55%),
                    radial-gradient(circle at 85% 90%, rgba(139, 38, 53, 0.02), transparent 55%);
                
                border: 1px solid var(--border-tint);
                border-radius: 2px;
                padding: 24px 28px 18px;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), 0 4px 12px rgba(0, 0, 0, 0.08);
            }

            .widget-card::before {
                content: '';
                position: absolute;
                inset: 6px;
                border: 1px solid var(--border-tint);
                opacity: 0.5;
                pointer-events: none;
            }

            ::selection {
                background: var(--accent);
                color: var(--bg-card);
            }

            .masthead {
                text-align: center;
                flex: none;
                margin-bottom: 4px;
            }
            
            h1 {
                margin: 0;
                font-family: 'Playfair Display', serif;
                font-weight: 700;
                font-size: 2rem;
                letter-spacing: 0.5px;
                color: var(--accent);
            }
            
            .date-line {
                margin: 6px 0 0;
                font-style: italic;
                font-weight: 500;
                font-size: 0.9rem;
                color: var(--ink2);
            }

            .divider {
                display: flex;
                align-items: center;
                gap: 12px;
                margin: 12px 0 12px;
                flex: none;
            }
            .divider::before, .divider::after {
                content: '';
                flex: 1;
                height: 1px;
                background: var(--hairline2);
            }
            .divider .diamond {
                width: 6px;
                height: 6px;
                background: var(--accent-dark);
                transform: rotate(45deg);
                flex: none;
            }

            /* Wrappers for auto-scrolling */
            #menu-window {
                position: relative;
                flex: 1;
                display: flex;
                flex-direction: column;
                min-height: 0;
                overflow: hidden;
            }

            #scroll-overlay {
				position: absolute;
				inset: 0;
				pointer-events: none;
				z-index: 50;
				background: transparent;
				transition: opacity 0.3s ease;
			}

            #menu-content {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                overflow-x: hidden;
            }

            #menus-container {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                overflow-x: hidden;
            }

            #period-selector {
                display: flex;
                justify-content: center;
                gap: 20px;
                margin-bottom: 16px;
                padding-bottom: 12px;
                border-bottom: 1px solid var(--hairline2);
                flex: none;
            }
            .period-button {
                background: none;
                border: none;
                padding: 2px 4px 6px;
                font-family: 'Lora', serif;
                font-weight: 600;
                letter-spacing: 0.5px;
                text-transform: uppercase;
                font-size: 0.85rem;
                color: var(--ink2);
                position: relative;
                transition: color 0.2s ease;
                cursor: pointer;
            }
            .period-button:hover, .period-button.active {
                color: var(--accent);
            }
            .period-button.active::after {
                content: '';
                position: absolute;
                left: 0;
                right: 0;
                bottom: -1px;
                height: 2px;
                background: var(--accent);
            }
            .period-button:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 3px;
            }

            .period-menu {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                overflow-x: hidden;
                padding-right: 8px;
                display: none;
                flex-direction: column;
                gap: 14px;
				scrollbar-gutter: stable;
            }
            .period-menu.active {
                display: flex;
            }

            .category {
                display: flex;
                flex-direction: column;
            }

            .category-header {
                position: relative;
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                font-family: 'Playfair Display', serif;
                font-weight: 700;
                font-size: 1.05rem;
                letter-spacing: 1px;
                text-transform: uppercase;
                border-bottom: 1px dashed var(--hairline1);
                padding-bottom: 6px;
                margin-bottom: 8px;
                color: var(--accent-dark);
                cursor: pointer;
            }
            .cat-name {
                transition: color 0.18s ease;
            }
            .category-header:hover .cat-name {
                color: var(--accent);
            }
            
            .toggle-icon {
                display: inline-block;
                font-size: 1.1rem;
                line-height: 1;
                color: var(--accent);
                transition: transform 0.35s ease;
                font-family: sans-serif;
            }

            .progress-bar {
                position: absolute;
                bottom: -1px;
                left: 0;
                height: 2px;
                background: var(--accent);
                width: 0%;
                transition: width 0s linear;
                border-radius: 2px;
                pointer-events: none;
            }
            .category-header.hovering .progress-bar {
                width: 100%;
                transition: width .5s linear;
            }

            .items-wrapper {
                display: grid;
                grid-template-rows: 0fr;
                transition: grid-template-rows 0.35s ease;
            }
            .items-wrapper.expanded {
                grid-template-rows: 1fr;
                margin-bottom: 8px;
            }

            .items-container {
                overflow: hidden;
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            .item {
                position: relative;
                font-family: 'Lora', serif;
                font-weight: 500;
                font-size: 0.95rem;
                padding: 1px 8px 1px 16px;
                line-height: 1.35;
                color: var(--ink1);
                border-radius: 3px;
                transition: background 0.16s ease, color 0.16s ease, padding-left 0.16s ease;
                cursor: default;
            }
            .item::before {
                content: '◆';
                position: absolute;
                left: 2px;
                top: 7px;
                font-size: 0.45rem;
                color: var(--accent-dark);
            }
            .item:hover {
                background: var(--accent-faded);
                color: var(--accent);
                padding-left: 24px;
            }
            .item:hover::before {
                color: var(--accent);
            }

            /* Global Tooltip */
            .nutrition-tooltip {
                visibility: hidden;
                opacity: 0;
                position: fixed;
                background: var(--bg-nutrition);
                padding: 12px 16px;
                border-radius: 4px;
                width: max-content;
                min-width: 160px;
                font-family: 'Lora', serif;
                font-weight: 500;
                font-size: 0.85rem;
                color: var(--ink1);
                line-height: 1.6;
                pointer-events: none;
                z-index: 99999;
                border: 1px solid var(--border-tint);
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12), 0 2px 8px rgba(0, 0, 0, 0.04);
            }
            .nutrition-tooltip.visible {
                visibility: visible;
                opacity: 1;
            }
            .nutrition-tooltip .nutrition-title {
                font-family: 'Playfair Display', serif;
                font-weight: 700;
                font-size: 1.05rem;
                color: var(--accent);
            }

            .status-footer {
                font-style: italic;
                font-weight: 500;
                font-size: 0.75rem;
                color: var(--ink2);
                text-align: right;
                padding-top: 10px;
                flex: none;
            }

            /* Elegant Scrollbars */
            ::-webkit-scrollbar {
                width: 6px;
                height: 6px;
            }
            ::-webkit-scrollbar-track {
                background: rgba(0, 0, 0, 0.04);
                border-radius: 4px;
            }
            ::-webkit-scrollbar-thumb {
                background: rgba(0, 0, 0, 0.12);
                border-radius: 4px;
            }
        </style>
    </head>
    <body>
        <div id="global-tooltip" class="nutrition-tooltip"></div>

		<div class="widget-card">
			<div class="masthead">
				<h1>UAFS MENU</h1>
				<p class="date-line" id="date-line"></p>
			</div>

			<div class="divider"><span class="diamond"></span></div>
			
			<div id="period-header"></div> 

			<div id="menu-window">
				<div id="scroll-overlay"></div>
				<div id="menu-content">Loading today's menu...</div>
			</div>

			<div class="status-footer" id="last-updated"></div>
		</div>

        <script>
            function newElement(tag, parent, options = {}) {
                const { text = null, html = null, id = null, classes = null, style = {}, attributes = {} } = options;
                const element = document.createElement(tag);

                if (id) element.id = id;
                if (text !== null) element.textContent = text;
                else if (html !== null) element.innerHTML = html;

                if (classes) {
                    const classList = Array.isArray(classes) ? classes : classes.split(' ').filter(Boolean);
                    element.classList.add(...classList);
                }

                Object.assign(element.style, style);
                if (tag === 'button') element.style.outline = 'none';

                for (const [attr, val] of Object.entries(attributes)) {
                    if (val !== null && val !== undefined) element.setAttribute(attr, val);
                }

                let parentElement = typeof parent === 'string' ? (parent === 'body' ? document.body : document.getElementById(parent)) : parent;
                if (parentElement) parentElement.appendChild(element);
                return element;
            }

            function renderDateLine() {
                const dateLine = document.getElementById('date-line');
                if (!dateLine) return;
                dateLine.textContent = new Date().toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
            }

            async function fetchMenu() {
				let today = new Date().toISOString().split('T')[0];
				const urlHeader = `https://apiv4.dineoncampus.com/locations/5f4936c257e0d8184670a220`;
				
				// Target the new period-header alongside your other containers
				const periodHeader = document.getElementById('period-header');
				const menuContent = document.getElementById('menu-content');
				const lastUpdated = document.getElementById('last-updated');
				const globalTooltip = document.getElementById('global-tooltip');

				const autoCollapsedNames = ["salad", "deli", "soup", "continental/nook"];
				const isCollapsedByDefault = (name) => autoCollapsedNames.some(ac => name.toLowerCase().includes(ac));

				try {
					const response = await fetch(`${urlHeader}/periods/?date=${today}`);
					if (!response.ok) throw new Error(`HTTP ${response.status}`);
					const { periods = [] } = await response.json();

					if (periods.length === 0) {
						menuContent.textContent = 'No menu listed for today.';
						return;
					}

					// Clear both containers before rendering
					periodHeader.innerHTML = '';
					menuContent.innerHTML = '';
					
					// Inject the period selector into the outer header
					const periodSelector = newElement('div', periodHeader, { id: 'period-selector' });
					const menusContainer = newElement('div', menuContent, { id: 'menus-container' });

					let isFirstPeriod = true;

                    for (const period of periods) {
                        const menuResponse = await fetch(`${urlHeader}/menu?date=${today}&period=${period.id}`);
                        if (!menuResponse.ok) continue;

                        const data = await menuResponse.json();
                        let categories = data.menu?.period?.categories || data.period?.categories || [];

                        // Sort the categories so auto-collapsed items go to the bottom
                        categories.sort((a, b) => {
                            let aCol = isCollapsedByDefault(a.name);
                            let bCol = isCollapsedByDefault(b.name);
                            return (aCol === bCol) ? 0 : aCol ? 1 : -1;
                        });

                        const btnClasses = isFirstPeriod ? ['period-button', 'active'] : ['period-button'];
                        const btn = newElement('button', periodSelector, {
                            classes: btnClasses,
                            text: period.name
                        });

                        const menuClasses = isFirstPeriod ? ['period-menu', 'active'] : ['period-menu'];
                        const periodMenu = newElement('div', menusContainer, {
                            classes: menuClasses
                        });

                        const activateTab = () => {
                            document.querySelectorAll('.period-button').forEach(b => b.classList.remove('active'));
                            document.querySelectorAll('.period-menu').forEach(m => m.classList.remove('active'));
                            btn.classList.add('active');
                            periodMenu.classList.add('active');
                        };
                        btn.addEventListener('click', activateTab);
                        btn.addEventListener('mouseenter', activateTab);

                        for (let category of categories) {
                            if (category.name == "Milk & Condiments") continue;
                            const shouldAutoCollapse = isCollapsedByDefault(category.name);
                            const categoryDiv = newElement('div', periodMenu, { classes: 'category' });

                            const header = newElement('div', categoryDiv, {
                                classes: 'category-header',
                                html: `
                                    <span class="cat-name">${category.name}</span>
                                    <span class="toggle-icon">&rsaquo;</span>
                                    <div class="progress-bar"></div>
                                `
                            });

                            // Smooth animation wrapper
                            const wrapper = newElement('div', categoryDiv, { classes: 'items-wrapper' });
                            const itemsContainer = newElement('div', wrapper, { classes: 'items-container' });

                            // Handle expansion logic and icons
                            const toggleCategory = (forceExpand = null) => {
                                const isExp = wrapper.classList.contains('expanded');
                                const willExpand = forceExpand !== null ? forceExpand : !isExp;
                                
                                if (willExpand) {
                                    wrapper.classList.add('expanded');
                                    header.querySelector('.toggle-icon').style.transform = 'rotate(90deg)';
                                } else {
                                    wrapper.classList.remove('expanded');
                                    header.querySelector('.toggle-icon').style.transform = 'rotate(0deg)';
                                }
                            };

                            // Default expand normal items, default collapse soup/condiments
                            if (!shouldAutoCollapse) {
                                toggleCategory(true);
                            }

                            // Hovering
                            let hoverTimer = null;

                            header.addEventListener('mouseenter', () => {
                                header.classList.add('hovering');
                                hoverTimer = setTimeout(() => {
                                    toggleCategory();
                                    
                                    if (header.classList.contains('hovering')) {
                                        header.classList.remove('hovering');
                                    }
                                }, 500);
                            });

                            header.addEventListener('mouseleave', () => {
                                if (hoverTimer) {
                                    clearTimeout(hoverTimer);
                                    hoverTimer = null;
                                }
                                header.classList.remove('hovering');
                            });

                            // Render specific food items
                            for (const item of category.items) {
                                const itemDiv = newElement('div', itemsContainer, {
                                    classes: 'item',
                                    text: item.name
                                });

                                let nutritionText = `<span class="nutrition-title">${item.name}</span><br><strong>Serving size</strong>: ${item.portion}<br><strong>${item.calories}</strong> calories (kcal)<br><hr style="border:0; border-top: 1px dashed var(--hairline1); margin: 6px 0;">`;

                                for (const nutrient of item.nutrients) {
                                    let nutrientLabelIndex = nutrient.name.indexOf('(');
                                    let nutrientName = nutrientLabelIndex > -1 ? nutrient.name.substring(0, nutrientLabelIndex - 1) : nutrient.name;
                                    if (nutrientName.toLowerCase() == "calories" || nutrient.value == "0" || nutrient.value == "-") continue;

                                    if (nutrient.value.indexOf("less than") > -1) {
                                        nutritionText += `<strong>${nutrientName}</strong>: ${nutrient.value}<br>`;
                                    } else {
                                        nutritionText += `<strong>${nutrientName}</strong>: ${nutrient.value}${nutrient.uom}<br>`;
                                    }
                                }

                                // Tooltip tracking
                                itemDiv.addEventListener('mousemove', (e) => {
                                    globalTooltip.innerHTML = nutritionText;
                                    globalTooltip.classList.add('visible');

                                    let x = e.clientX + 15;
                                    let y = e.clientY + 15;
                                    const tooltipRect = globalTooltip.getBoundingClientRect();

                                    if (x + tooltipRect.width > window.innerWidth) x = window.innerWidth - tooltipRect.width - 10;
                                    if (y + tooltipRect.height > window.innerHeight) y = window.innerHeight - tooltipRect.height - 10;

                                    globalTooltip.style.left = `${x}px`;
                                    globalTooltip.style.top = `${y}px`;
                                });

                                itemDiv.addEventListener('mouseleave', () => {
                                    globalTooltip.classList.remove('visible');
                                });
                            }
                        }
                        isFirstPeriod = false;
                    }

                    const now = new Date();
                    lastUpdated.textContent = `Updated: ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
                    return false;
                }
                catch (err) {
                    console.error('Menu fetch error:', err);
                    menuContent.textContent = 'Unable to refresh menu.';
                }
                return true;
            }

            // Smooth gradient
			const menuWindow = document.getElementById('menu-window');
			const scrollOverlay = document.getElementById('scroll-overlay');

			let autoScrollSpeed = 0;
			let autoScrollFrame = null;
			let currentMouseY = 0;

			// Current rendered opacities (for lerp interpolation)
			let currentTopAlpha = 0;
			let currentBottomAlpha = 0;

			// Target opacities based on mouse position and scroll limits
			let targetTopAlpha = 0;
			let targetBottomAlpha = 0;

			function updateScrollTargets() {
				const activeMenu = document.querySelector('.period-menu.active');
				if (!activeMenu) return;

				const rect = menuWindow.getBoundingClientRect();
				const height = rect.height;
				const margin = height * 0.2;

				targetTopAlpha = 0;
				targetBottomAlpha = 0;
				autoScrollSpeed = 0;

				const isAtTop = activeMenu.scrollTop <= 0;
				const isAtBottom = Math.ceil(activeMenu.scrollTop + activeMenu.clientHeight) >= activeMenu.scrollHeight;

				// Evaluate top margin
				if (currentMouseY < margin) {
					const intensity = 1 - (currentMouseY / margin);
					if (!isAtTop) {
						targetTopAlpha = intensity * 0.3;
						autoScrollSpeed = -intensity * 10;
					}
				} 
				// Evaluate bottom margin
				else if (currentMouseY > height - margin) {
					const intensity = 1 - ((height - currentMouseY) / margin); 
					if (!isAtBottom) {
						targetBottomAlpha = intensity * 0.3;
						autoScrollSpeed = intensity * 10;
					}
				}
			}

			function processAutoScroll() {
				const activeMenu = document.querySelector('.period-menu.active');

				// Scroll the container if speed is active
				if (autoScrollSpeed !== 0 && activeMenu) {
					activeMenu.scrollTop += autoScrollSpeed;
				}

				// Re-calculate scroll target states based on new scroll position
				updateScrollTargets();
				currentTopAlpha += (targetTopAlpha - currentTopAlpha) * 0.1;
				currentBottomAlpha += (targetBottomAlpha - currentBottomAlpha) * 0.1;

				// Clean up floating point tiny numbers when near 0
				if (Math.abs(currentTopAlpha) < 0.001) currentTopAlpha = 0;
				if (Math.abs(currentBottomAlpha) < 0.001) currentBottomAlpha = 0;

				// Render the interpolated background gradient
				const rect = menuWindow.getBoundingClientRect();
				const height = rect.height;
				const margin = height * 0.2;

				scrollOverlay.style.background = `linear-gradient(to bottom, 
					rgba(35, 30, 25, ${currentTopAlpha}) 0%, 
					transparent ${margin}px, 
					transparent ${height - margin}px, 
					rgba(35, 30, 25, ${currentBottomAlpha}) 100%)`;

				// Continue running the loop while scrolling OR while gradient is fading out
				const isGradientFading = currentTopAlpha > 0 || currentBottomAlpha > 0;
				
				if (autoScrollSpeed !== 0 || isGradientFading) {
					autoScrollFrame = requestAnimationFrame(processAutoScroll);
				} else {
					autoScrollFrame = null;
				}
			}

			menuWindow.addEventListener('mousemove', (e) => {
				const rect = menuWindow.getBoundingClientRect();
				currentMouseY = e.clientY - rect.top;
				
				updateScrollTargets();

				if (!autoScrollFrame) {
					autoScrollFrame = requestAnimationFrame(processAutoScroll);
				}
			});

			menuWindow.addEventListener('mouseleave', () => {
				autoScrollSpeed = 0;
				targetTopAlpha = 0;
				targetBottomAlpha = 0;
				
				if (!autoScrollFrame) {
					autoScrollFrame = requestAnimationFrame(processAutoScroll);
				}
			});

            async function initMenuTracker() {
                renderDateLine();
                const hasError = await fetchMenu();
                if (hasError) {
                    setInterval(fetchMenu, 5 * 1000); // Update every 5 seconds if failing
                } else {
                    setInterval(fetchMenu, 60 * 60 * 1000); // Update every hour
                }
            }

            initMenuTracker();
        </script>
    </body>
</html>
